# ReChord theme package — the house monochrome look (BRNOMT-69).
#
# Install:  copy this directory to /Internal/.rechord/themes/mono-nothing/
# Activate: Settings → Theme, or write "mono-nothing" to
#           /Internal/.rechord/active_theme. The palette and the layout below
#           are parsed from this same file and committed together.
# Values are bounded (docs/rewrite/themes.md); an out-of-range value rejects the
# whole package and the active theme stays in effect.

format=1
name=Nothing Mono
home=menu
home_nav=vertical

# palette (theme_file.c) — RGB565
background=0x0000
surface=0x0000
text=0xFFFF
text_dim=0x8410
accent=0xFFFF
danger=0xC618
success=0xFFFF

# layout (theme_pkg.c)
pad=4
title_h=16
item_h=12
np_title_y=24
np_artist_y=36
np_state_y=48
np_info_y=60
np_bar_y=74
np_bar_h=2
np_time_y=84
np_mode_y=148
np_vol_y=162
np_vol_h=2
