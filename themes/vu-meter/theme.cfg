# ReChord "VU Meter" — two 1970s backlit VU meters (data only).
# RGB565 in this manifest; the skins use DECIMAL RGB565 literals.

[theme]
format=1
home=skin
home_nav=horizontal
skin=home.skin
skin_now_playing=now_playing.skin
skin_library=library.skin
skin_library_cat=library_cat.skin
skin_browser=browser.skin
skin_settings=settings.skin
name=VU Meter
author=ReChord

[colors]
background=0x0841
surface=0x1904
text=0x6F9B
text_dim=0x2C6F
accent=0xFDA8
danger=0xEA05
success=0x7F0D

[main_menu]
pad=6
title_h=16
item_h=14
face_h=150
home_bar_y=150
home_bar_h=20

[now_playing]
np_title_y=113
np_artist_y=123
np_state_y=123
np_info_y=138
np_bar_y=133
np_bar_h=2
np_time_y=138
np_mode_y=156
np_vol_y=160
np_vol_h=2

# Real VU scale split in three single-colour bitmaps: black arc (64 px),
# black bridge (19 px) and the red +0..+3 band (41 px) = 760 B of the cache.
asset_vu_a=assets/vu_a.bin,64,40
asset_vu_b=assets/vu_b.bin,19,40
asset_vu_red=assets/vu_red.bin,41,40
asset_dial_ticks=assets/dial_ticks.bin,64,10
