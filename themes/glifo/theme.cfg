# Glifo — Nothing-style dot matrix on black, one red accent.
# Pure data. Install as /.rechord/themes/glifo/

[theme]
format=1
name=Glifo
author=ReChord
home=skin
home_nav=vertical
skin=home.skin
skin_now_playing=now_playing.skin
skin_library=library.skin
skin_library_cat=library_cat.skin
skin_browser=browser.skin
skin_settings=settings.skin

[colors]
background=0x0000
surface=0x39C7
text=0xFFFF
text_dim=0xB596
accent=0xF800
danger=0xF800
success=0xFFFF
spacing=8
radius=0

[main_menu]
pad=6
title_h=16
item_h=14
face_h=170

[now_playing]
np_title_y=52
np_artist_y=68
np_state_y=4
np_info_y=4
np_bar_y=156
np_bar_h=6
np_time_y=65
np_mode_y=156
np_vol_y=156
np_vol_h=6

# 5x7 digits scaled 3px, stacked in pairs (10 glyphs, 8-asset cap).
# colon is the clock separator. logo is the home wordmark.
asset_d01=assets/d01.bin,19,54
asset_d23=assets/d23.bin,19,54
asset_d45=assets/d45.bin,19,54
asset_d67=assets/d67.bin,19,54
asset_d89=assets/d89.bin,19,54
asset_colon=assets/colon.bin,8,27
asset_logo=assets/logo.bin,64,14
