# Aura — lock-screen wash from the cover palette, with a dusk fallback.
# Pure data. Install as /.rechord/themes/aura/

[theme]
format=1
name=Aura
author=ReChord
home=skin
home_nav=vertical
skin=home.skin
skin_now_playing=now_playing.skin
skin_library=library.skin
skin_library_cat=library_cat.skin
skin_browser=browser.skin
skin_settings=settings.skin

[colors]
background=0x18A6
surface=0x2909
text=0xF79F
text_dim=0xB539
accent=0xE5BF
danger=0xFA6D
success=0x7FF8
spacing=8
radius=8

[main_menu]
pad=6
title_h=16
item_h=14
face_h=170

[now_playing]
np_title_y=54
np_artist_y=40
np_state_y=146
np_info_y=18
np_bar_y=100
np_bar_h=8
np_time_y=84
np_mode_y=114
np_vol_y=142
np_vol_h=8

# Transport glyphs and the home wordmark. Title stays on the 8x8 font.
asset_prev=assets/prev.bin,24,24
asset_next=assets/next.bin,24,24
asset_play=assets/play.bin,24,24
asset_pause=assets/pause.bin,24,24
asset_logo=assets/logo.bin,64,20
