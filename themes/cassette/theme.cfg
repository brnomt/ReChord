# ReChord "Cassette" — data-driven theme.
#
# The look is defined by the cassette mockup (320x170, ReChord 8x8 font).
# The [colors] block below is the FIXED fallback palette used when the current
# track has no cover (warm grey / cream / amber); with art the skins use the
# precomputed art_* shades instead. Nothing about this theme is compiled.

[theme]
format=1
home=skin
home_nav=horizontal
skin=home.skin
skin_now_playing=now_playing.skin
skin_library=library.skin
skin_library_cat=library_cat.skin
skin_browser=browser.skin
skin_settings=settings.skin
name=Cassette
author=ReChord

[colors]
background=0x20E3
surface=0x3164
text=0xF75B
text_dim=0x9C91
accent=0xED07
danger=0xC2A7
success=0x7CCB
spacing=8
radius=0

[main_menu]
face_h=146
home_bar_y=146
home_bar_h=24
pad=6
title_h=14
item_h=14

[now_playing]
np_title_y=24
np_artist_y=36
np_state_y=48
np_info_y=60
np_bar_y=74
np_bar_h=2
np_time_y=84
np_mode_y=148
np_vol_y=162
np_vol_h=2

# 1-bit assets: the screw head (grey disc + dark cross slot) and the hub core
# (dark centre with six cream spokes, drawn on the cream hub disc).
asset_screw=assets/screw.bin,8,8
asset_hub=assets/hub.bin,16,16
