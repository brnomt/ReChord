# ReChord "Companion Bot" — monolithic 1-bit companion (BRNOMT-69).
#
# Sections are informational: the parser reads the flat key=value lines and
# skips [section] headers, so this file works with theme_file.c (colors) and
# theme_pkg.c (layout) unchanged.
#
# The face is PROCEDURAL (firmware/ui/screens/companion.c): no bitmaps, no
# asset cache, no allocation. `face_h` reserves the band above the list and
# tells the main menu to paint the companion there.

[theme]
format=1
name=Companion Bot
author=ReChord

[colors]
background=0x0000
surface=0x0000
text=0xFFFF
text_dim=0x8410
accent=0xFFFF
danger=0xC618
success=0xFFFF
spacing=8
radius=0

[main_menu]
face_h=52
pad=6
title_h=14
item_h=14

[now_playing]
np_title_y=26
np_artist_y=38
np_state_y=50
np_info_y=62
np_bar_y=78
np_bar_h=2
np_time_y=88
np_mode_y=150
np_vol_y=162
np_vol_h=2
