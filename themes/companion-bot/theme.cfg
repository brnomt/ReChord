# ReChord "Companion Bot" — 100% data-driven theme (BRNOMT-69).
#
# NOTHING about this theme is compiled: the palette/layout live here and the
# whole home screen (geometry, animation, button mapping) lives in home.skin.
# The firmware's generic interpreter reads and executes it. The reference look
# is vector, so no bitmaps are required; the engine still supports optional
# assets for themes that want them.

[theme]
format=1
home=skin
home_nav=horizontal
skin=home.skin
skin_now_playing=now_playing.skin
skin_library=library.skin
skin_library_cat=library_cat.skin
skin_browser=browser.skin
skin_settings=settings.skin
name=Companion Bot
author=ReChord

[colors]
background=0x0000
surface=0x0000
text=0xFFFF
text_dim=0x8410
accent=0xFFFF
danger=0xC618
success=0xFFFF
spacing=8
radius=0

[main_menu]
face_h=122
home_bar_y=152
home_bar_h=14
pad=6
title_h=14
item_h=14

[now_playing]
np_title_y=26
np_artist_y=38
np_state_y=50
np_info_y=62
np_bar_y=78
np_bar_h=2
np_time_y=88
np_mode_y=150
np_vol_y=162
np_vol_h=2
