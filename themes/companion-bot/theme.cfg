# ReChord "Companion Bot" — 100% data-driven theme (BRNOMT-69).
#
# NOTHING about this theme is compiled: the palette/layout live here, the
# home screen logic lives in home.skin, and the eye frames live in assets/.
# The firmware's generic interpreter reads and executes all of it.

[theme]
format=1
home=skin
home_nav=horizontal
skin=home.skin
name=Companion Bot
author=ReChord

[colors]
background=0x0000
surface=0x0000
text=0xFFFF
text_dim=0x8410
accent=0xFFFF
danger=0xC618
success=0xFFFF
spacing=8
radius=0

[main_menu]
face_h=112
home_bar_y=152
home_bar_h=14
pad=6
title_h=14
item_h=14

[now_playing]
np_title_y=26
np_artist_y=38
np_state_y=50
np_info_y=62
np_bar_y=78
np_bar_h=2
np_time_y=88
np_mode_y=150
np_vol_y=162
np_vol_h=2

# --- assets (1-bit, MSB-first, stride = (w+7)/8) ------------------------
asset_eye_open=assets/eye_open.bin,64,64
asset_eye_half=assets/eye_half.bin,64,32
asset_eye_closed=assets/eye_closed.bin,64,6
asset_eye_happy_left=assets/eye_happy_left.bin,64,64
asset_eye_happy_right=assets/eye_happy_right.bin,64,64
