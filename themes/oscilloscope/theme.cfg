# ReChord "Oscilloscope" — laboratory scope (data only).
# One package, two sweep rates: opt_fps=Refresh selects 20 or 60 fps.
# 320x170 RGB565. Colors in the skins are DECIMAL RGB565 (the expression
# parser has no 0x literals); this manifest keeps the 0xRRRR form.

[theme]
format=1
home=skin
home_nav=horizontal
skin=home.skin
skin_now_playing=now_playing.skin
skin_library=library.skin
skin_library_cat=library_cat.skin
skin_browser=browser.skin
skin_settings=settings.skin
name=Oscilloscope
author=ReChord

[colors]
background=0x0081
surface=0x1123
text=0x7FF6
text_dim=0x2C4A
accent=0xFD88
danger=0xFAC9
success=0x7FF6

[main_menu]
pad=6
title_h=16
item_h=14
face_h=148
home_bar_y=148
home_bar_h=22

[now_playing]
np_title_y=101
np_artist_y=112
np_state_y=123
np_info_y=123
np_bar_y=140
np_bar_h=4
np_time_y=123
np_mode_y=157
np_vol_y=160
np_vol_h=2

# Per-theme options: the skin reads the selected index as opt_fps, so the
# 20 fps and 60 fps variants are one package (Settings > Theme, long press).
opt_fps=Refresh,20 fps|60 fps

# No bitmap assets: the trace and the X-Y goniometer are drawn live from the
# audio tap (type=scope).
