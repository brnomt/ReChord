# ReChord "Oscilloscope" — OSC-20 RC laboratory scope (data only).
# 320x170 RGB565. Colors in the skins are DECIMAL RGB565 (the expression
# parser has no 0x literals); this manifest keeps the 0xRRRR form.

[theme]
format=1
home=skin
home_nav=horizontal
skin=home.skin
skin_now_playing=now_playing.skin
skin_library=library.skin
skin_library_cat=library_cat.skin
skin_browser=browser.skin
skin_settings=settings.skin
name=Oscilloscope
author=ReChord

[colors]
background=0x0081
surface=0x1123
text=0x7FF6
text_dim=0x2C4A
accent=0xFD88
danger=0xFAC9
success=0x7FF6

[main_menu]
pad=6
title_h=16
item_h=14
face_h=148
home_bar_y=148
home_bar_h=22

[now_playing]
np_title_y=101
np_artist_y=112
np_state_y=123
np_info_y=123
np_bar_y=140
np_bar_h=4
np_time_y=123
np_mode_y=157
np_vol_y=160
np_vol_h=2

# Phosphor trace tiles + goniometer. 3 x 64x32 + 48x40 = 1008 B of the 1 KiB
# cache; the halo is baked into the 1-bit tiles (bitmaps are opaque).
asset_w1=assets/w1.bin,64,32
asset_w2=assets/w2.bin,64,32
asset_w3=assets/w3.bin,64,32
asset_xy=assets/xy.bin,48,40
